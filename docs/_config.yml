# GitHub Pages site for oi-browser, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: oi-browser
description: Ổi Browser is a zero-dependency, self-hosted agentic AI browser with 9 3D Vietnamese fruit companions, DOM agent automation, and local SQLite + Markdown memory.
url: https://jangtrinh.github.io
baseurl: /oi-browser
lang: en
repository: jangtrinh/oi-browser
repository_url: https://github.com/jangtrinh/oi-browser
wordmark: JANG TRINH
wordmark_url: https://github.com/jangtrinh
eyebrow: LOCAL-FIRST AI BROWSER · VIETNAMESE FRUIT COMPANION OS          # short product family label, e.g. design:os
logo: /images/cover.png          # a real capture under docs/images/
nav:                        # one entry per Markdown page under docs/, in reading order
  - { title: Deep dive, url: /deep-dive.html }
footer:
  - { title: GitHub, url: https://github.com/jangtrinh/oi-browser }
  - { title: PolyForm Shield 1.0.0, url: https://github.com/jangtrinh/oi-browser/blob/main/LICENSE }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
