<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Ổi Browser 1.0.0 — 5-Layer System Architecture" style="font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect x="0" y="0" width="1120" height="620" rx="12" fill="#FAF8F5"/>
  <!-- Layer 1: Shell & Surface -->
  <rect x="24" y="20" width="1072" height="96" rx="10" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5"/>
  <text x="44" y="46" font-size="12" font-weight="600" fill="#2E8B57" letter-spacing="0.06em">LAYER 1 · DESKTOP SHELL &amp; SVELTEKIT 5 RENDERER (public/_app/ + src/macos/)</text>
  <rect x="44" y="58" width="240" height="44" rx="6" fill="#F3EFEA"/>
  <text x="58" y="78" font-size="13" font-weight="600" fill="#181512">macOS WKWebView Shell</text>
  <text x="58" y="94" font-size="11" fill="#575049">berry-desktop-shell.swift (49 LOC)</text>
  <rect x="300" y="58" width="250" height="44" rx="6" fill="#F3EFEA"/>
  <text x="314" y="78" font-size="13" font-weight="600" fill="#181512">SvelteKit 5 + Tailwind v4 UI</text>
  <text x="314" y="94" font-size="11" fill="#575049">/newtab · /chat · /hire · /routines · /skills</text>
  <rect x="566" y="58" width="250" height="44" rx="6" fill="#F3EFEA"/>
  <text x="580" y="78" font-size="13" font-weight="600" fill="#181512">3D Fruit + Lottie Engine</text>
  <text x="580" y="94" font-size="11" fill="#575049">berry-fruit-lottie.js (87 LOC)</text>
  <rect x="832" y="58" width="244" height="44" rx="6" fill="#F3EFEA"/>
  <text x="846" y="78" font-size="13" font-weight="600" fill="#181512">3D Guava Brand &amp; 9 Companions</text>
  <text x="846" y="94" font-size="11" fill="#575049">/fruits-3d/*.png + /fruits/*.json</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M560 116 L560 142" stroke="#2E8B57" stroke-width="2"/>
  <polygon points="555,138 565,138 560,146" fill="#2E8B57"/>

  <!-- Layer 2: Client IPC Bridge -->
  <rect x="24" y="146" width="1072" height="104" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="44" y="172" font-size="12" font-weight="600" fill="#2E8B57" letter-spacing="0.06em">LAYER 2 · CLIENT ELECTRON IPC SHIM &amp; REACTIVE TOPIC BUS (src/client/)</text>
  <rect x="44" y="184" width="330" height="52" rx="6" fill="#EEF7F1"/>
  <text x="58" y="205" font-size="13" font-weight="600" fill="#181512">window.electronAPI &amp; EventBus</text>
  <text x="58" y="223" font-size="11" fill="#575049">berry-electron-bridge.js (159 LOC) · subscribeIPCState</text>
  <rect x="392" y="184" width="336" height="52" rx="6" fill="#EEF7F1"/>
  <text x="406" y="205" font-size="13" font-weight="600" fill="#181512">State Topic Synthesizer (18 topics)</text>
  <text x="406" y="223" font-size="11" fill="#575049">berry-electron-state.js (140 LOC) · companions/chat/layout</text>
  <rect x="746" y="184" width="330" height="52" rx="6" fill="#EEF7F1"/>
  <text x="760" y="205" font-size="13" font-weight="600" fill="#181512">IPC Query &amp; Invoke Router</text>
  <text x="760" y="223" font-size="11" fill="#575049">berry-electron-queries.js (198 LOC) · 0 Cloud Lock-in</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M560 250 L560 280" stroke="#2E8B57" stroke-width="2"/>
  <polygon points="555,276 565,276 560,284" fill="#2E8B57"/>
  <text x="572" y="270" font-size="11" font-weight="600" fill="#2E8B57">HTTP REST JSON · 127.0.0.1:4104 (/api/*)</text>

  <!-- Layer 3: Localhost HTTP & Orchestrator -->
  <rect x="24" y="284" width="1072" height="104" rx="10" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5"/>
  <text x="44" y="310" font-size="12" font-weight="600" fill="#2E8B57" letter-spacing="0.06em">LAYER 3 · LOCALHOST SERVER &amp; MULTI-STEP ORCHESTRATOR (src/server/)</text>
  <rect x="44" y="322" width="330" height="52" rx="6" fill="#F3EFEA"/>
  <text x="58" y="343" font-size="13" font-weight="600" fill="#181512">Node.js HTTP Server (Port 4104)</text>
  <text x="58" y="361" font-size="11" fill="#575049">berry-http-server.js (174 LOC) · 12 REST Endpoints</text>
  <rect x="392" y="322" width="336" height="52" rx="6" fill="#F3EFEA"/>
  <text x="406" y="343" font-size="13" font-weight="600" fill="#181512">Companion Chat Orchestrator</text>
  <text x="406" y="361" font-size="11" fill="#575049">companion-chat-orchestrator.js (158 LOC) · 4-Step Tool Loop</text>
  <rect x="746" y="322" width="330" height="52" rx="6" fill="#F3EFEA"/>
  <text x="760" y="343" font-size="13" font-weight="600" fill="#181512">9 Vietnamese Fruit Companions + 31 Skills</text>
  <text x="760" y="361" font-size="11" fill="#575049">official-companions-catalog.js (186 LOC)</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M210 388 L210 416" stroke="#2E8B57" stroke-width="2"/>
  <path d="M560 388 L560 416" stroke="#2E8B57" stroke-width="2"/>
  <path d="M910 388 L910 416" stroke="#2E8B57" stroke-width="2"/>

  <!-- Layer 4 & 5: Execution Engines & Persistence -->
  <rect x="24" y="416" width="340" height="180" rx="10" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5"/>
  <text x="44" y="442" font-size="12" font-weight="600" fill="#2E8B57">LAYER 4A · AGENT DOM ENGINE</text>
  <text x="44" y="464" font-size="13" font-weight="600" fill="#181512">agent-dom-browser-service.js (153 LOC)</text>
  <text x="44" y="486" font-size="12" fill="#575049">• Interactive node tagging [data-oi-id]</text>
  <text x="44" y="506" font-size="12" fill="#575049">• H1-H3 hierarchy &amp; &lt;tr&gt; table extraction</text>
  <text x="44" y="526" font-size="12" fill="#575049">• Annotated HTML proxy (/api/browser/proxy)</text>
  <text x="44" y="546" font-size="12" fill="#575049">• Visual Artifact synthesis (Sheet / Brief)</text>

  <rect x="388" y="416" width="344" height="180" rx="10" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5"/>
  <text x="408" y="442" font-size="12" font-weight="600" fill="#2E8B57">LAYER 4B · KARPATHY-WIKI MEMORY</text>
  <text x="408" y="464" font-size="13" font-weight="600" fill="#181512">karpathy-wiki-memory-engine.js (177 LOC)</text>
  <text x="408" y="486" font-size="12" fill="#575049">• Tier 1 Pinned: PROFILE.md &amp; COMPANION.md</text>
  <text x="408" y="506" font-size="12" fill="#575049">• Tier 2 Daily: observations/YYYY-MM-DD.md</text>
  <text x="408" y="526" font-size="12" fill="#575049">• Tier 3 Graph: entities/companies/*.md</text>
  <text x="408" y="546" font-size="12" fill="#575049">• Dream Consolidation (/api/memory/dream)</text>

  <rect x="756" y="416" width="340" height="180" rx="10" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5"/>
  <text x="776" y="442" font-size="12" font-weight="600" fill="#2E8B57">LAYER 5 · LOCAL SQLITE STORE</text>
  <text x="776" y="464" font-size="13" font-weight="600" fill="#181512">sqlite-workspace-store.js (192 LOC)</text>
  <text x="776" y="486" font-size="12" fill="#575049">• Built-in node:sqlite (DatabaseSync)</text>
  <text x="776" y="506" font-size="12" fill="#575049">• 6 tables: tabs, companions, chat_messages,</text>
  <text x="776" y="526" font-size="12" fill="#575049">  routines, artifacts, meetings</text>
  <text x="776" y="546" font-size="12" fill="#575049">• Persisted at .berry-data/workspace.sqlite</text>
</svg>
