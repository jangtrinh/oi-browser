    <script>
      {
        if (location.pathname === '/') {
          history.replaceState(null, '', '/newtab' + location.search + location.hash)
        }
        const initialTheme = new URLSearchParams(location.search).get('theme') ?? localStorage.getItem('berry-theme') ?? 'light'
        document.documentElement.classList.toggle('dark', initialTheme === 'dark')
        document.documentElement.style.colorScheme = initialTheme
      }

      // Onboarding opens on the dark welcome stage. Mark it before anything paints so a slow load
      // shows black, never the light theme, until the onboarding layout draws its own background.
      if (location.pathname.startsWith('/onboarding')) {
        document.documentElement.classList.add('onboarding-boot')
      }

      // Polyfill crypto.randomUUID for non-secure contexts (app:// protocol)
      if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
        crypto.randomUUID = function () {
          return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) =>
            (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)
          )
        }
      }
    </script>
